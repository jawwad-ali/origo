# Production stack on the Oracle Cloud VM (ARM64). PostgreSQL is managed (Neon), not here.
# Run from the repo root on the VM:
#   docker compose -f infra/docker-compose.prod.yml --env-file infra/.env.production up -d
name: origo

x-app: &app
  build:
    context: ..
    dockerfile: apps/api/Dockerfile
  image: origo-api:${IMAGE_TAG:-latest}
  env_file: .env.production
  environment: &app-env
    NODE_ENV: production
    REDIS_URL: redis://redis:6379
    LABEL_EXPORT_DIR: /app/var/label-exports
  depends_on:
    redis:
      condition: service_healthy
  volumes:
    - label_exports:/app/var/label-exports
  restart: always
  read_only: true
  tmpfs:
    - /tmp
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  api:
    <<: *app
    environment:
      <<: *app-env
      PORT: "4000"
      COOKIE_SECURE: "true"
      TRUST_PROXY_HOPS: "2"
    expose:
      - "4000"

  # Same image, different entry point: consumes the job queues (label PDFs, cleanup).
  worker:
    <<: *app
    command: ["node", "dist/worker.js"]
    healthcheck:
      disable: true
    stop_grace_period: 60s

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  caddy:
    image: caddy:2.10-alpine
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in infra/.env.production}
      ACME_EMAIL: ${ACME_EMAIL:?set ACME_EMAIL in infra/.env.production}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: always
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

volumes:
  caddy_data:
  caddy_config:
  redis_data:
  label_exports:
