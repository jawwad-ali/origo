# Local development services. Run from the repo root:
#   docker compose -f infra/docker-compose.dev.yml up -d
# Postgres is optional if you use a Neon dev branch; Redis is needed for label exports.
name: origo-dev

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: origo
      POSTGRES_PASSWORD: origo
      POSTGRES_DB: origo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origo -d origo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    profiles: ["postgres"]

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
