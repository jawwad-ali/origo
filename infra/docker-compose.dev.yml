# Local development services. Run from the repo root:
#   docker compose -f infra/docker-compose.dev.yml up -d
name: origo-dev

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: origo
      POSTGRES_PASSWORD: origo
      POSTGRES_DB: origo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U origo -d origo"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
