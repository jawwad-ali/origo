packages:
  - apps/*
  - packages/*

onlyBuiltDependencies:
  - "@nestjs/core"
  - "@prisma/client"
  - "@prisma/engines"
  - "@tailwindcss/oxide"
  - argon2
  - esbuild
  - prisma
  - sharp
  - unrs-resolver

# @nestjs/platform-express requires rxjs at runtime without declaring it.
packageExtensions:
  "@nestjs/platform-express":
    peerDependencies:
      rxjs: "^7.1.0"
